  - key: overview
    caption: Whole route, north at top.
  - key: north
    caption: Days 1–3.
  - key: merv
    caption: Days 3–5.
  - key: authion
    caption: Days 5–6.
  - key: menton
    caption: Day 7.
  rules_title: Rules and water
  rules:
  - title: Park core
    text: '(Col du Barn to just past Pas du Diable): tent up 19:00–09:00 only, low tent, more than one hour from a road, new spot each night, stove yes, fire no, no dogs.'
  - title: 'Merveilles zone:'
    text: bivouac only on the marked area behind the Refuge des Merveilles. Stay on the trail. Metal pole tips need rubber caps. Wardens fine.
  - title: 'Dry stretches:'
    text: Merveilles → Camp d'Argent and Sospel → Menton. Nothing mapped, nothing in any report. 3 L each.
  refuges:
    caption: Refuges, water and where to pitch
    columns:
    - Place
    - Alt.
    - Open
    - Tent
    - Note
    rows:
    - - Saint-Dalmas-Valdeblore
      - 1,290 m
      - village
      - HI hostel, booked 11 Sep
      - bus 90, small shop, taps
    - - Le Boréon
      - 1,500 m
      - hotel-restaurant
      - 'night 1: lake or ranch, ≈€10'
      - dinner out 1
    - - <a href="https://refugelacougourde.ffcam.fr/">Refuge de la Cougourde</a>
      - 2,100 m
      - to 19 Sep
      - Trécolpas, 30 min
      - tap, showers
    - - <a href="https://www.explorenicecotedazur.com/en/gite-refuge/refuge-de-la-madone-de-fenestre/">Madone de Fenestre</a>
      - 1,903 m
      - to 30 Sep
      - 'night 2: refuge bed, or Lac de Fenestre 1 h above'
      - tap, dinner, road
    - - <a href="https://refugedenice.ffcam.fr/">Refuge de Nice</a>
      - 2,232 m
      - to end Sep
      - by the lake
      - tap; footbridge gone, ford
    - - <a href="https://refugedesmerveilles.ffcam.fr/GB_home.html">Refuge des Merveilles</a>
      - 2,130 m
      - to end Oct
      - marked area only
      - tap, cash only, guided walks
    - - <a href="https://www.estive-mercantour.fr/">L'Estive, Camp d'Argent</a>
      - 1,750 m
      - to 1 Oct
      - ask
      - dinner, tap, road to Turini
    - - Sospel
      - 350 m
      - village
      - Camping Sainte-Madeleine
      - shops, station, fountains
  tech_title: Technical options and via ferrata
  tech_intro: 'On the line: Trécolpas to Pas des Ladres (steep, blocky), the Pas du Mont Colomb rock step (T3 dry), boulders below Baisse du Basto, and two long loose descents where the reports'' injuries happen. Beyond that:'
  tech:
    caption: Technical options and via ferrata
    columns:
    - Objective
    - From
    - What it is
    - Time
    rows:
    - - <a href="https://www.viaferrata-fr.net/via-ferrata-42-Les-Baus-de-la-Frema-La-Colmiane-Alpes-Maritimes.html">Via ferrata Baus de la Frema</a>
      - La Colmiane, bus 90 stop above Saint-Dalmas
      - Grade D, TD variant. 40 m footbridge, overhangs, summit 2,246 m. €6 access, €21 kit, book 24 h ahead, closed in rain.
      - 4–5 h + 1 h down
    - - <a href="https://www.trace-ta-route.com/randonnee-mercantour-mont-bego/">Mont Bégo 2,872 m</a>
      - Refuge des Merveilles
      - Cairned walk, no difficulty, +750 m.
      - 3–4 h
    - - <a href="https://www.visorando.com/en/walk-la-cime-du-diable-2685m/">Cime du Diable 2,685 m</a>
      - Pas du Diable
      - Steep marked path via Pas du Trem.
      - ≈2 h
    - - <a href="https://www.altituderando.com/Mont-Colomb-2816m">Mont Colomb 2,816 m</a>
      - Pas du Mont Colomb
      - Off-trail scramble, dry rock and topo needed. Needs the spare day.
      - 2–3 h
    - - Cime du Gélas 3,143 m
      - Madone de Fenestre
      - AD couloir, rockfall when dry. Skip in September.
      - —
    - - <a href="https://www.mercantour-roya.com/via-ferrata/">Roya via ferratas</a>
      - Tende, La Brigue, by train from Sospel
      - Easy to moderate, guided ≈€50. Only for a spare day. Peille's L'Escale is closed.
      - half day
  practical:
  - title: September
    items:
    - Storms rare, unlike July and August. Valley highs 20–24 °C, 0–5 °C at the high bivouacs, frost possible.
    - First snow on Colomb and Basto is possible from mid-September. If it falls, wait a day.
    - Sunrise ≈07:10, sunset ≈19:45.
    - <b>Live forecast:</b> each day card above shows the current forecast for that day's night spot and high point, from <a href="https://open-meteo.com/">Open-Meteo</a>, refreshed every time the page loads, with warnings derived for thunderstorms, rain, snow and freezing level, ridge wind, frost, heat, fog and UV. The last forecast is kept for offline reading.
    - <b>Official sources to check the day before:</b> <a href="https://vigilance.meteofrance.fr/fr/alpes-maritimes">Météo-France vigilance, Alpes-Maritimes</a> (colour warnings for storms, rain, heat), <a href="https://meteofrance.com/meteo-montagne/mercantour">Météo-France mountain bulletin, Mercantour</a> (freezing level, wind at 2,000 and 3,000 m, storm timing), <a href="https://www.mercantour-parcnational.fr/fr/des-decouvertes/ou-sinformer/info-sentiers">park trail notices</a>.
    - 'Trail notices (park site, 4 Sep): Boréon line reopened; fords at Cougourde and Refuge de Nice. Re-check <a href="https://www.mercantour-parcnational.fr/fr/des-decouvertes/ou-sinformer/info-sentiers">Info sentiers</a> before leaving.'
  - title: Transport
    items:
    - 'Nice → Saint-Dalmas: <a href="https://www.bougerenville.com/bus-90-nice-grand-arenas-valdeblore-horaires-plan/">bus 90</a>, weekdays 08:10, 16:40, 18:40 from Les Arboras via Grand Arénas, ≈2 h. Confirm on the <a href="https://www.lignesdazur.com/">Lignes d''Azur</a> app the week before.'
    - 'Menton → Nice: trains every 20–30 min, 35 min.'
    - 'Bail-outs: Madone de Fenestre road, Col de Turini road, Sospel station.'
  practical_right:
  - title: Gear
    items:
    - Sleeping system to 0 °C.
    - Poles with rubber tips.
    - 3 L capacity each plus a filter.
    - Four days of food from Nice. Cash for refuges.
    - 'Offline maps: OsmAnd with the GPX, plus IGN 3741 OT and 3841 OT.'
    - 'Hang food: foxes and boar raid tents by the lakes.'
    - Headtorch; you will cook at dusk.
    - 'Emergency: 112.'
  extra:
  - title: Car rental at the end
    intro: Verified on 4 September 2026 from the agencies' own pages. Menton has two confirmed agencies near the station. They close at 18:00 and you arrive Friday around 17:00–18:00 after the descent, so plan on either a Saturday morning pickup in Menton or the airport the same evening.
