        - 24 Av. des Alliés, 100 m
        - Mon–Fri 08:30–12:00, 15:00–18:00; Sat 08:30–12:00, 16:00–18:00; Sun closed
        - 04 92 10 16 07
        - low
        - rarely
        - Closest. Cars and vans, small fleet, station shuttle on request.
      - - <a href="https://www.rentacar.fr/agences/491-menton">Rent a Car</a>
        - 4 Av. Cochrane, 300 m
        - Mon–Sat 08:30–12:00, 14:00–18:00; Sun closed
        - 04 93 35 18 49
        - low–mid
        - 'yes'
        - Only Menton agency confirming one-way rentals.
      - - '<a href="https://www.nice.aeroport.fr/en/services/car-rental">Nice airport</a>: <a href="https://www.sixt.com/car-rental/france/nice/nice-airport-terminal-1/">Sixt</a>, <a href="https://www.hertz.co.uk/p/car-hire/france/nice/nice-airport">Hertz</a>, <a href="https://www.europcar.com/en-us/places/car-rental-france/nice/nice-cote-d-azur-airport">Europcar</a>, <a href="https://www.avis.fr/services-avis/location-voiture/europe/france/nice/aeroport-de-nice-cote-d-azur">Avis</a>'
        - train Menton → Nice-Ville 35 min, tram 2 to the airport
        - Sixt 07:30–24:00 daily; T1 desks to 22:00, then the Car Rental Center at T2
        - —
        - Sixt ≈€50/day in September
        - 'yes'
        - Same-evening pickup, widest choice, cheapest one-way.
    notes:
    - <b>Listed online but not operating:</b> Europcar, 9 Av. Thiers, shows "temporarily closed" since 2021 and its booking page is gone. Avis "Gare de Menton" shows closed every day of the week on avis.fr. Ignore both in comparison sites. Prices are September 2026 snapshots from <a href="https://www.kayak.com/Cheap-Menton-Car-Rentals.45983.cars.ksp">Kayak</a>; book about a month ahead. Keep licence and the booking card in the pack.
