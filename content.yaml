en:
  eyebrow: GR52 · Mercantour · 12 – 18 September 2026
  title: GR52 Bivouac Dossier
  lede: Yarden and Ayelet land in Nice on Friday 11 September, sleep in Saint-Dalmas, walk seven days to Menton with a tent, and take the train back to Nice. Their stage split, with the technical options named.
  facts:
  - value: ≈95 km
    label: Saint-Dalmas → Menton
  - value: ≈6,200 m
    label: total ascent
  - value: ≈7,500 m
    label: total descent
  - value: 2,693 m
    label: high point, Baisse du Basto
  - value: 7 days
    label: Sat 12 → Fri 18 Sep
  - value: 3 L
    label: water to carry on two dry days
  plan_title: The plan
  plan_intro: Yarden and Ayelet's split, which is the official FFRandonnée staging. Times are guidebook times plus 20 %. In the park core the tent may only stand from 19:00 to 09:00 and sunset is about 19:45, so arrive by 18:00 and cook first. The GPX layers in your Downloads folder match these nights.
  snapshot_hint: 'One position fix, no tracking: marks finished days done and fills in today''s distance, ascent left and arrival estimate. Long-press to pick your position on the map instead. Tap a day title to see it on the map.'
  days:
  - n: 0
    date: '2026-09-11'
    label: FRI 11 SEP
    title: Land in Nice 09:45 → a few hours in town → bus 90 → Saint-Dalmas
    stats:
    - bus 90 leaves 16:40, ≈2 h
    - hostel check-in closes 19:00
    text:
    - '<b>The tight bit.</b> Bus 90 runs Nice to La Bolline three times a day on weekdays, at 08:10, 16:40 and 18:40 from Les Arboras, passing Grand Arénas a few minutes later. The 16:40 arrives around 18:40; the 18:40 arrives after check-in closes. Take the 16:40, be at Grand Arénas by 16:15, and phone the hostel on +33 4 22 49 01 06 in the morning to say you arrive about 18:45. Booked: twin room at HI hostel "Le Chalet", breakfast included, restaurant on site for dinner, check-out by 10:00.'
    - '<b>Nice, 10:30 to 16:00.</b> Tram 2 from the airport to Grand Arénas is one stop, so leave the packs in a locker there or carry them. Buy four days of food and a gas cartridge, which cannot fly with you, at the Decathlon or a supermarket near Grand Arénas. Then tram into the old town: Cours Saleya market for lunch, the Castle Hill viewpoint, the Promenade. Be back on tram 2 by 15:45.'
    hours: 2
  - n: 1
    date: '2026-09-12'
    label: SAT 12 SEP
    title: Saint-Dalmas → Col de Veillos → Col du Barn → Salèse valley → Le Boréon
    stats:
    - ≈18 km
    - +1,350 / −1,150 m
    - 9 h official, plan 10–11
    - tent by the lake at Le Boréon, ≈1,500 m
    text:
    - 'The longest day, straight after travel. Breakfast at 07:00, walk by 08:00, and you arrive around 18:30. Water at a spring on the way up and at Lac Petit; nothing on the col. Col du Barn (2,452 m) is the park boundary; the trail then swings through the Salèse valley on the line restored after Storm Alex. Le Boréon is outside the core, so no 19:00 rule: the lake is beside the road, and one report paid €10 to pitch at the horse ranch. <b>Dinner out 1:</b> the hotel-restaurant at Le Boréon. <b>If you are behind schedule</b> at Lac Petit by 14:00, sleep there and finish the stage in the morning.'
    hours: 11
  - n: 2
    date: '2026-09-13'
    label: SUN 13 SEP
    title: Le Boréon → Lac de Trécolpas → Pas des Ladres → Madone de Fenestre
    stats:
    - ≈9 km
    - +1,000 / −600 m
    - 5.5 h official, plan 6–7
    - refuge bed or Lac de Fenestre, see below
    text:
    - 'Short and steep. Trécolpas to Pas des Ladres (2,448 m) is one of the three sections the French guides flag. <b>Camping is banned around Madone de Fenestre.</b> Two legal options: a bed at the refuge (62 places, open to 30 September, book online, dinner served), or carry on one hour to Lac de Fenestre (2,266 m) and bivouac there inside the core. The refuge bed is the comfortable choice and shortens day 3 by nothing; the lake shortens day 3 by an hour.'
    hours: 7
  - n: 3
    date: '2026-09-14'
    label: MON 14 SEP
    title: Madone de Fenestre → Pas du Mont Colomb → Refuge de Nice
    stats:
    - ≈7 km
    - +700 / −350 m
    - 4.5 h official, plan 5–6
    - tent by Lac de la Fous, ≈2,230 m
    text:
    - 'The technical day. Pas du Mont Colomb (2,548 m): scree to a narrow breach with a 2–3 m rock step, fine dry, not in rain. Boulders down to the refuge; the footbridge is gone, so a ford. Short day, so this is where Mont Colomb (2,816 m, off-trail scramble, 2–3 h) fits if the rock is dry and you have the topo.'
    hours: 6
  - n: 4
    date: '2026-09-15'
    label: TUE 15 SEP
    title: Refuge de Nice → Baisse du Basto → Refuge des Merveilles
    stats:
    - ≈11 km
    - +800 / −900 m
    - 5–6 h
    - tent only on the marked area behind the refuge
    text:
    - 'Over the high point (2,693 m) into the Vallée des Merveilles: marked trail only, rubber tips on poles, no touching engravings. Afternoon: Mont Bégo (2,872 m, +750 m, easy, sea view) or the guided engraving walk. Refuge dinner available, cash only.'
    hours: 6
  - n: 5
    date: '2026-09-16'
    label: WED 16 SEP
    title: Merveilles → Pas du Diable → Authion ridge → Camp d'Argent
    stats:
    - ≈18 km
    - +700 / −1,050 m
    - 7–8 h
    - gîte or tent, 1,750 m, outside the core
    text:
    - 'No water after the refuge until Camp d''Argent: leave with 3 L each. Option: Cime du Diable (2,685 m, +2 h) from the pass. <b>Dinner out 2:</b> L''Estive gîte, open to 1 October; ask where to pitch.'
    hours: 8
  - n: 6
    date: '2026-09-17'
    label: THU 17 SEP
    title: Camp d'Argent → Sospel
    stats:
    - ≈16 km
    - +300 / −1,700 m
    - 5–6 h
    - Camping Sainte-Madeleine, ≈€19
    text:
    - Long, steep, hot descent. Start early. Sospel has shops, a bakery and a station on the Nice–Tende line. <b>Dinner out 3:</b> Sospel, by the old bridge. Fill every bottle for tomorrow.
    hours: 6
  - n: 7
    date: '2026-09-18'
    label: FRI 18 SEP
    title: Sospel → Col du Berceau → Menton → train to Nice
    stats:
    - ≈17 km
    - +1,150 / −1,500 m
    - 8–9 h
    - trains to Nice every 20–30 min, 35 min
    text:
    - 'No water at all in a dry September: 3 L each. The last hour below Col du Berceau (1,090 m) is steep and loose. Then the sea, and the train back to Nice.'
    hours: 9
  maps_intro: This map is drawn live from the same GPX file you download for OsmAnd, so the two never differ. Tap any line or dot for its note. The layers button toggles each track and each kind of waypoint, the same list as in OsmAnd. "Where am I" shows your position, the kilometre on the route and the distance to the next night. "Save this area offline" stores the visible map tiles in the browser; the page and the GPX are stored automatically, so the site keeps working without signal. Add it to your home screen for an app-like view. Base map OpenTopoMap; planning aid only, carry IGN 3741 OT and 3841 OT.
