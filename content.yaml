he:
  eyebrow: GR52 · מרקנטור · 12–18 בספטמבר 2026
  title: GR52 עם אוהל
  lede: ירדן ואיילת נוחתים בניס ביום שישי 11 בספטמבר, ישנים ב-Saint-Dalmas, הולכים שבעה ימים עד Menton עם אוהל, וחוזרים ברכבת לניס. החלוקה שלהם לימים, עם האופציות הטכניות.
  facts:
  - value: ≈95 ק"מ
    label: Saint-Dalmas עד Menton
  - value: ≈6,200 מ'
    label: עלייה מצטברת
  - value: ≈7,500 מ'
    label: ירידה מצטברת
  - value: 2,693 מ'
    label: הנקודה הגבוהה, Baisse du Basto
  - value: 7 ימים
    label: שבת 12 עד שישי 18 בספטמבר
  - value: 3 ליטר
    label: מים לסחוב בשני ימים יבשים
  plan_title: התוכנית
  plan_intro: החלוקה של ירדן ואיילת, שהיא בדיוק השלבים הרשמיים של FFRandonnée. הזמנים הם זמני המדריך פלוס 20 אחוז. בלב הפארק מותר להקים אוהל רק בין 19:00 ל-09:00 והשמש שוקעת בסביבות 19:45, אז מגיעים עד 18:00 ומבשלים לפני שמקימים. שכבות ה-GPX בתיקיית ההורדות תואמות ללילות האלה.
  snapshot_hint: 'קריאת מיקום אחת, בלי מעקב: מסמנת ימים שהסתיימו כהושלמו וממלאת את המרחק, העלייה שנותרה והערכת ההגעה להיום. לחיצה ארוכה בוחרת את המיקום במפה במקום GPS. לחצו על כותרת יום כדי לראות אותו במפה.'
  days:
  - n: 0
    date: '2026-09-11'
    label: שישי 11.9
    title: נחיתה בניס 09:45, כמה שעות בעיר, אוטובוס 90 ל-Saint-Dalmas
    stats:
    - אוטובוס 90 יוצא 16:40, כשעתיים
    - צ'ק-אין באכסניה נסגר ב-19:00
    text:
    - '<b>הנקודה הצפופה.</b> קו 90 מניס ל-La Bolline נוסע שלוש פעמים ביום בימי חול: 08:10, 16:40 ו-18:40 מ-Les Arboras, ועובר ב-Grand Arénas כמה דקות אחר כך. האוטובוס של 16:40 מגיע בסביבות 18:40; זה של 18:40 מגיע אחרי שהצ''ק-אין נסגר. קחו את ה-16:40, תהיו ב-Grand Arénas עד 16:15, ותתקשרו לאכסניה בבוקר (06 01 49 22 4 33+) להגיד שאתם מגיעים בערך ב-18:45. מה שהוזמן: חדר עם שתי מיטות באכסניית HI "Le Chalet", ארוחת בוקר כלולה, יש מסעדה במקום לארוחת ערב, צ''ק-אאוט עד 10:00.'
    - '<b>ניס, 10:30 עד 16:00.</b> רכבת קלה קו 2 מהשדה ל-Grand Arénas זו תחנה אחת; אפשר להשאיר תיקים בלוקר שם או לסחוב. קונים אוכל לארבעה ימים ומיכל גז (אי אפשר לטוס איתו) בדקתלון או בסופר ליד Grand Arénas. אחר כך ברכבת הקלה לעיר העתיקה: שוק Cours Saleya לצהריים, נקודת התצפית בגבעת הטירה, הטיילת. חוזרים לרכבת הקלה עד 15:45.'
  - n: 1
    date: '2026-09-12'
    label: שבת 12.9
    title: Saint-Dalmas, דרך Col de Veillos ו-Col du Barn ועמק Salèse, עד Le Boréon
    stats:
    - ≈18 ק"מ
    - +1,350 / −1,150 מ'
    - 9 שעות רשמי, לתכנן 10–11
    - אוהל ליד האגם ב-Le Boréon, ≈1,500 מ'
    text:
    - 'היום הארוך ביותר, ישר אחרי הנסיעה. ארוחת בוקר ב-07:00, יוצאים עד 08:00, מגיעים בסביבות 18:30. מים במעיין בדרך למעלה וב-Lac Petit; אין מים במעבר. Col du Barn (2,452 מ'') הוא גבול הפארק; משם השביל עובר דרך עמק Salèse בתוואי ששוקם אחרי הסופה Alex. Le Boréon מחוץ ללב הפארק, אז אין כלל 19:00: האגם צמוד לכביש, ודוח אחד שילם €10 להקים בחוות הסוסים. <b>ארוחת ערב בחוץ 1:</b> המסעדה של המלון ב-Le Boréon. <b>אם אתם בפיגור</b> ומגיעים ל-Lac Petit אחרי 14:00, ישנים שם ומסיימים את השלב בבוקר.'
    hours: 9
