  practical:
  - title: ספטמבר
    items:
    - סופות נדירות, בניגוד ליולי ואוגוסט. בעמקים 20–24 מעלות, בלינות הגבוהות 0–5, ייתכן כפור.
    - שלג ראשון על Colomb ו-Basto אפשרי מאמצע ספטמבר. אם ירד, מחכים יום.
    - זריחה ≈07:10, שקיעה ≈19:45.
    - <b>תחזית חיה:</b> כל כרטיס יום למעלה מציג את התחזית העדכנית לנקודת הלינה ולנקודה הגבוהה של אותו יום, מ-<a href="https://open-meteo.com/">Open-Meteo</a>, מתרעננת בכל טעינה של הדף, עם אזהרות שנגזרות ממנה לסופות רעמים, גשם, שלג וגובה הקיפאון, רוח על הרכס, כפור, חום, ערפל וקרינה. התחזית האחרונה נשמרת לקריאה באופליין.
    - <b>מקורות רשמיים לבדוק יום לפני:</b> <a href="https://vigilance.meteofrance.fr/fr/alpes-maritimes">Météo-France vigilance, Alpes-Maritimes</a> (אזהרות צבע לסופות, גשם, חום), <a href="https://meteofrance.com/meteo-montagne/mercantour">בולטין ההרים של Météo-France, Mercantour</a> (גובה קיפאון, רוח ב-2,000 ו-3,000 מ', תזמון סופות), <a href="https://www.mercantour-parcnational.fr/fr/des-decouvertes/ou-sinformer/info-sentiers">הודעות השבילים של הפארק</a>.
    - 'הודעות שבילים (אתר הפארק, 4.9): הקטע ליד Boréon נפתח מחדש; חציות נחל ליד Cougourde ו-Refuge de Nice. לבדוק שוב ב-<a href="https://www.mercantour-parcnational.fr/fr/des-decouvertes/ou-sinformer/info-sentiers">Info sentiers</a> לפני היציאה.'
  - title: תחבורה
    items:
    - 'ניס עד Saint-Dalmas: <a href="https://www.bougerenville.com/bus-90-nice-grand-arenas-valdeblore-horaires-plan/">אוטובוס 90</a>, בימי חול 08:10, 16:40, 18:40 מ-Les Arboras דרך Grand Arénas, כשעתיים. לאשר באפליקציית <a href="https://www.lignesdazur.com/">Lignes d''Azur</a> שבוע לפני.'
    - 'Menton עד ניס: רכבת כל 20–30 דקות, 35 דקות נסיעה.'
    - 'יציאות חירום: הכביש ל-Madone de Fenestre, הכביש ב-Col de Turini, תחנת הרכבת ב-Sospel.'
  practical_right:
  - title: ציוד
    items:
    - שק שינה ומזרן שמחזיקים עד 0 מעלות.
    - מקלות עם גומיות.
    - 3 ליטר קיבולת לאדם ומסנן.
    - אוכל לארבעה ימים מניס. מזומן לבקתות.
    - 'מפות אופליין: OsmAnd עם ה-GPX, וגם IGN 3741 OT ו-3841 OT.'
    - 'לתלות את האוכל: שועלים וחזירי בר פושטים על אוהלים ליד האגמים.'
    - פנס ראש; תבשלו בחושך.
    - 'חירום: 112.'
